<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Results Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            background-color: #fff;
        }
        input[type="text"] {
            width: 100%;
            max-width: 300px;
        }
        select {
            max-width: 200px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
        }
        th {
            background-color: #2980b9;
            color: white;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        th:hover {
            background-color: #3498db;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .gender-f {
            color: #e84393;
            font-weight: bold;
        }
        .gender-m {
            color: #0984e3;
            font-weight: bold;
        }
        .th-sort-asc::after { content: " ▲"; font-size: 11px; }
        .th-sort-desc::after { content: " ▼"; font-size: 11px; }
    </style>
</head>

        // Global variable tracking currently visible rows to enable sorting on filtered results
        let currentDisplayData = [...runnerData];

        function loadTableData(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            data.forEach(runner => {
                let row = `<tr>
                    <td>${runner.pl}</td>
                    <td>${runner.contest}</td>
                    <td>${runner.bib}</td>
                    <td>${runner.club}</td>
                    <td>${runner.leg}</td>
                    <td><b>${runner.name}</b></td>
                    <td><span class="gender-${runner.gender}">${runner.gender.toUpperCase()}</span></td>
                    <td>${runner.time}</td>
                    <td>${runner.gap}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;

            currentDisplayData = runnerData.filter(runner => {
                const matchesSearch = runner.name.toLowerCase().includes(query) || 
                                      runner.bib.includes(query) || 
                                      runner.club.toLowerCase().includes(query);
                
                const matchesCategory = (selectedCategory === 'All') || (runner.contest === selectedCategory);
                
                return matchesSearch && matchesCategory;
            });

            loadTableData(currentDisplayData);
        }

        let sortDirection = false;
        function sortTable(columnIndex) {
            const keys = ['pl', 'contest', 'bib', 'club', 'leg', 'name', 'gender', 'time', 'gap'];
            const key = keys[columnIndex];
            
            sortDirection = !sortDirection;
            
            currentDisplayData.sort((a, b) => {
                let valA = a[key];
                let valB = b[key];
                
                if (typeof valA === 'number') {
                    return sortDirection ? valA - valB : valB - valA;
                } else {
                    return sortDirection ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
            });

            const headers = document.querySelectorAll('th');
            headers.forEach(th => th.classList.remove('th-sort-asc', 'th-sort-desc'));
            headers[columnIndex].classList.add(sortDirection ? 'th-sort-asc' : 'th-sort-desc');

            loadTableData(currentDisplayData);
        }

        window.onload = () => { loadTableData(runnerData); };
    </script>
